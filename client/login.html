<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuestBoard — Login or Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg site-nav">
    <div class="container">
      <a class="navbar-brand brand" href="index.html"><span class="brand-mark">Q</span> QUEST<span>BOARD</span></a>
      <div class="collapse navbar-collapse" id="mainNav">
        <div class="navbar-nav ms-auto"></div>
      </div>
    </div>
  </nav>

  <main class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="panel" style="width: 100%; max-width: 480px; padding: 32px;">
      <div class="text-center mb-4">
        <p class="eyebrow"><span class="live-dot"></span> AUTHENTICATION SYSTEM</p>
        <h2 class="text-gradient">Welcome to QuestBoard</h2>
        <p class="muted small mt-1">Log in or create your hero account to start questing.</p>
      </div>

      <ul class="nav nav-pills nav-fill mb-4" id="authTabs" role="tablist" style="background: var(--bg); padding: 4px; border-radius: 8px; border: 1px solid var(--line);">
        <li class="nav-item" role="presentation">
          <button class="nav-link active py-2" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button" role="tab" style="font-size: 13px; font-weight: 600;">Log In</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link py-2" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane" type="button" role="tab" style="font-size: 13px; font-weight: 600;">Create Account</button>
        </li>
      </ul>

      <div class="tab-content" id="authTabContent">
        <!-- Login Pane -->
        <div class="tab-pane fade show active" id="login-pane" role="tabpanel" aria-labelledby="login-tab">
          <form id="login-form">
            <div class="mb-3">
              <label class="form-label" for="login-username">Username</label>
              <input class="form-control game-input" id="login-username" required placeholder="e.g. pixel_paladin">
            </div>
            <div class="mb-4">
              <label class="form-label" for="login-password">Password</label>
              <input type="password" class="form-control game-input" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-neon w-100 py-2">Log In ↗</button>
          </form>
          <p class="form-message mt-3 text-center" id="login-message" aria-live="polite"></p>
        </div>

        <!-- Register Pane -->
        <div class="tab-pane fade" id="register-pane" role="tabpanel" aria-labelledby="register-tab">
          <form id="register-form">
            <div class="mb-3">
              <label class="form-label" for="reg-username">Username</label>
              <input class="form-control game-input" id="reg-username" required placeholder="3-20 chars (letters, numbers, _)" maxlength="20">
              <div class="form-text text-muted small">Only lowercase letters, numbers, and underscores.</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="reg-password">Password</label>
              <input type="password" class="form-control game-input" id="reg-password" required placeholder="At least 4 characters" minlength="4">
            </div>
            <div class="mb-3">
              <label class="form-label" for="reg-avatar">Avatar Emoji</label>
              <select class="form-select game-select" id="reg-avatar">
                <option value="🧙‍♂️">🧙‍♂️ Wizard</option>
                <option value="⚔️">⚔️ Paladin</option>
                <option value="🛡️">🛡️ Guardian</option>
                <option value="🔮">🔮 Sage</option>
                <option value="👾">👾 Hacker</option>
                <option value="⚡">⚡ Speedrunner</option>
                <option value="🦊">🦊 Rogue</option>
                <option value="🤖">🤖 Bot</option>
              </select>
            </div>
            <div class="mb-4">
              <label class="form-label d-block">Hero Classes (Pick at least one)</label>
              <div class="d-flex gap-4 mt-2">
                <div class="form-check">
                  <input class="form-check-input game-checkbox" type="checkbox" value="Coder" id="class-coder" checked>
                  <label class="form-check-label" for="class-coder">Coder</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input game-checkbox" type="checkbox" value="Designer" id="class-designer">
                  <label class="form-check-label" for="class-designer">Designer</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input game-checkbox" type="checkbox" value="Thinker" id="class-thinker">
                  <label class="form-check-label" for="class-thinker">Thinker</label>
                </div>
              </div>
            </div>
            <button type="submit" class="btn btn-neon w-100 py-2">Create Hero & Start ↗</button>
          </form>
          <p class="form-message mt-3 text-center" id="register-message" aria-live="polite"></p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
